<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:APP Data Lab - 位操作动画演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .navbar {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #667eea;
        }
        .navbar h1 {
            color: #667eea;
            font-size: 1.3em;
            text-align: center;
            margin-bottom: 10px;
        }
        .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-link {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-link:hover { background: #764ba2; transform: scale(1.05); }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .section {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            color: #333;
            scroll-margin-top: 80px;
        }
        h2 { color: #667eea; font-size: 1.3em; margin-bottom: 12px; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
        .code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        .kw { color: #66d9ef; }
        .fn { color: #e6db74; }
        .num { color: #ae81ff; }
        .op { color: #f92672; }
        .cmt { color: #75715e; }
        .controls { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="number"] {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 16px;
            font-size: 13px;
            width: 120px;
            outline: none;
        }
        .result-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 10px 12px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .result-box.error { background: #ffebee; border-color: #f44336; }
        .step {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 12px;
            margin: 8px 0;
            border-radius: 4px;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .step-num {
            display: inline-block;
            background: #ff9800;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 8px;
        }
        .bits-container { margin: 10px 0; }
        .bits-label { font-size: 12px; color: #666; margin-bottom: 4px; }
        .bits-row { display: flex; gap: 1px; justify-content: center; margin: 2px 0; }
        .bit {
            width: 20px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .bit-0 { background: #e0e0e0; color: #666; }
        .bit-1 { background: #667eea; color: white; }
        .bit-hl { transform: scale(1.2); box-shadow: 0 0 10px #ffc107; z-index: 10; background: #ffc107 !important; color: #333 !important; }
        .bit-new { background: #4caf50 !important; color: white !important; }
        .sep { width: 6px; }
        .value { font-family: monospace; background: #2d2d2d; color: #4caf50; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .rating { color: #ffc107; font-weight: bold; font-size: 12px; }
        .ops { color: #888; font-size: 11px; }
        .legend { display: flex; gap: 15px; justify-content: center; margin: 8px 0; font-size: 11px; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-box { width: 14px; height: 14px; border-radius: 2px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎮 CS:APP Data Lab - 位操作动画演示</h1>
        <div class="nav-links">
            <a class="nav-link" onclick="scrollTo('bitAnd')">1.bitAnd</a>
            <a class="nav-link" onclick="scrollTo('bitXor')">2.bitXor</a>
            <a class="nav-link" onclick="scrollTo('evenBits')">3.evenBits</a>
            <a class="nav-link" onclick="scrollTo('getByte')">4.getByte</a>
            <a class="nav-link" onclick="scrollTo('bitMask')">5.bitMask</a>
            <a class="nav-link" onclick="scrollTo('reverseBytes')">6.reverseBytes</a>
            <a class="nav-link" onclick="scrollTo('leastBitPos')">7.leastBitPos</a>
            <a class="nav-link" onclick="scrollTo('logicalNeg')">8.logicalNeg</a>
            <a class="nav-link" onclick="scrollTo('minusOne')">9.minusOne</a>
            <a class="nav-link" onclick="scrollTo('tmax')">10.tmax</a>
            <a class="nav-link" onclick="scrollTo('negate')">11.negate</a>
            <a class="nav-link" onclick="scrollTo('isPositive')">12.isPositive</a>
            <a class="nav-link" onclick="scrollTo('isLess')">13.isLess</a>
            <a class="nav-link" onclick="scrollTo('sm2tc')">14.sm2tc</a>
            <a class="nav-link" onclick="scrollTo('greatestBitPos')">15.greatestBitPos</a>
            <a class="nav-link" onclick="scrollTo('isNegative')">16.isNegative</a>
            <a class="nav-link" onclick="scrollTo('isGreater')">17.isGreater</a>
            <a class="nav-link" onclick="scrollTo('tmin')">18.tmin</a>
            <a class="nav-link" onclick="scrollTo('plusOne')">19.plusOne</a>
        </div>
    </nav>

    <div class="container" id="container"></div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const ANIM_DELAY = 2500; // 动画间隔2.5秒
        const hex = n => '0x' + (n >>> 0).toString(16).toUpperCase().padStart(8, '0');
        const bin = n => (n >>> 0).toString(2).padStart(32, '0');
        const scrollTo = id => document.getElementById(id).scrollIntoView({behavior:'smooth'});

        function renderBits(value, highlight = [], extraClass = '') {
            let b = bin(value);
            let html = '<div class="bits-row">';
            for(let i = 0; i < 32; i++) {
                if(i > 0 && i % 8 === 0) html += '<div class="sep"></div>';
                let cls = b[i] === '1' ? 'bit-1' : 'bit-0';
                if(highlight.includes(31-i)) cls += ' bit-hl';
                html += `<div class="bit ${cls} ${extraClass}">${b[i]}</div>`;
            }
            html += '</div>';
            return html;
        }

        function renderBitsWithLabels(value, highlight = []) {
            let b = bin(value);
            let html = '<div class="bits-row">';
            for(let i = 0; i < 32; i++) {
                if(i > 0 && i % 8 === 0) html += '<div class="sep"></div>';
                let cls = b[i] === '1' ? 'bit-1' : 'bit-0';
                if(highlight.includes(31-i)) cls += ' bit-hl';
                html += `<div class="bit ${cls}">${b[i]}</div>`;
            }
            html += '</div><div class="bits-row" style="font-size:9px;color:#999;">';
            for(let i = 0; i < 32; i++) {
                if(i > 0 && i % 8 === 0) html += '<div class="sep"></div>';
                html += `<div class="bit" style="background:none;color:#999;">${31-i}</div>`;
            }
            return html + '</div>';
        }

        // 函数定义
        const functions = [
            {
                id: 'bitAnd',
                name: 'bitAnd',
                desc: '用 ~ 和 | 实现 x & y',
                rating: 1,
                maxOps: 8,
                code: `int bitAnd(int x, int y) {
  return ~(~x | ~y);
}`,
                inputs: [{id:'x',label:'x',value:6},{id:'y',label:'y',value:5}],
                animate: async (get, set, step) => {
                    let x = get('x'), y = get('y');
                    step(1, `输入值`, `x = ${x} (${hex(x)}), y = ${y} (${hex(y)})`);
                    await set.bits('x', x);
                    await set.bits('y', y);

                    let notX = ~x;
                    step(2, `计算 ~x`, `~x = ${hex(notX)}`);
                    await set.bits('notX', notX, [31]);

                    let notY = ~y;
                    step(3, `计算 ~y`, `~y = ${hex(notY)}`);
                    await set.bits('notY', notY, [31]);

                    let or = notX | notY;
                    step(4, `计算 ~x | ~y`, `结果 = ${hex(or)}`);
                    await set.bits('or', or);

                    let r = ~or;
                    step(5, `计算 ~(~x | ~y)`, `最终结果 = ${hex(r)} = ${r}`);
                    await set.bits('result', r);
                    set.result(`bitAnd(${x}, ${y}) = ${r}`, true);
                }
            },
            {
                id: 'bitXor',
                name: 'bitXor',
                desc: '用 ~ 和 & 实现 x ^ y',
                rating: 2,
                maxOps: 14,
                code: `int bitXor(int x, int y) {
  return ~(~(x & ~y) & ~(~x & y));
}`,
                inputs: [{id:'x',label:'x',value:4},{id:'y',label:'y',value:5}],
                animate: async (get, set, step) => {
                    let x = get('x'), y = get('y');
                    step(1, `输入`, `x=${x} (${hex(x)}), y=${y} (${hex(y)})`);
                    await set.bits('x', x);
                    await set.bits('y', y);

                    let a = x & ~y;
                    step(2, `x & ~y`, `${hex(a)}`);
                    await set.bits('a', a);

                    let na = ~a;
                    step(3, `~(x & ~y)`, `${hex(na)}`);
                    await set.bits('na', na);

                    let b = ~x & y;
                    step(4, `~x & y`, `${hex(b)}`);
                    await set.bits('b', b);

                    let nb = ~b;
                    step(5, `~(~x & y)`, `${hex(nb)}`);
                    await set.bits('nb', nb);

                    let and = na & nb;
                    step(6, `按位与`, `${hex(and)}`);
                    await set.bits('and', and);

                    let r = ~and;
                    step(7, `取反得结果`, `${hex(r)} = ${r}`);
                    await set.bits('result', r);
                    set.result(`bitXor(${x}, ${y}) = ${r}`, true);
                }
            },
            {
                id: 'evenBits',
                name: 'evenBits',
                desc: '返回所有偶数位为1的数 (0x55555555)',
                rating: 2,
                maxOps: 8,
                code: `int evenBits(void) {
  int bits = 0x55;
  bits = (bits << 8) | bits;
  return (bits << 16) | bits;
}`,
                inputs: [],
                animate: async (get, set, step) => {
                    step(1, `初始化`, `bits = 0x55 = 01010101`);
                    await set.bits('bits', 0x55);

                    let b = 0x55;
                    b = (b << 8) | b;
                    step(2, `扩展到16位`, `(0x55 << 8) | 0x55 = 0x5555`);
                    await set.bits('b16', b);

                    let r = (b << 16) | b;
                    step(3, `扩展到32位`, `(0x5555 << 16) | 0x5555 = 0x55555555`);
                    await set.bits('result', r);
                    set.result(`evenBits() = 0x55555555 = 1431655765`, true);
                }
            },
            {
                id: 'getByte',
                name: 'getByte',
                desc: '提取x的第n个字节 (0=LSB)',
                rating: 2,
                maxOps: 6,
                code: `int getByte(int x, int n) {
  return (x >> (n << 3)) & 0xFF;
}`,
                inputs: [{id:'x',label:'x',value:0x12345678},{id:'n',label:'n',value:1}],
                animate: async (get, set, step) => {
                    let x = get('x'), n = get('n');
                    step(1, `输入`, `x = ${hex(x)}, n = ${n}`);
                    await set.bits('x', x);

                    let shift = n << 3;
                    step(2, `计算移位量`, `n << 3 = ${n} × 8 = ${shift} 位`);

                    let shifted = x >>> shift;
                    step(3, `右移${shift}位`, `${hex(shifted)}`);
                    await set.bits('shifted', shifted);

                    let r = shifted & 0xFF;
                    step(4, `取低8位`, `& 0xFF = ${hex(r)}`);
                    await set.bits('result', r, [7,6,5,4,3,2,1,0]);
                    set.result(`getByte(${hex(x)}, ${n}) = 0x${r.toString(16).toUpperCase().padStart(2,'0')}`, true);
                }
            },
            {
                id: 'bitMask',
                name: 'bitMask',
                desc: '生成从lowbit到highbit全为1的掩码',
                rating: 3,
                maxOps: 16,
                code: `int bitMask(int highbit, int lowbit) {
  int high_mask = ~(~0 << highbit << 1);
  int low_mask = ~0 << lowbit;
  return high_mask & low_mask;
}`,
                inputs: [{id:'high',label:'highbit',value:5},{id:'low',label:'lowbit',value:3}],
                animate: async (get, set, step) => {
                    let high = get('high'), low = get('low');
                    step(1, `输入`, `highbit=${high}, lowbit=${low}`);

                    let hm = ~(~0 << high << 1);
                    step(2, `高位掩码`, `~(~0 << ${high} << 1) = ${hex(hm)}`);
                    await set.bits('hm', hm);

                    let lm = ~0 << low;
                    step(3, `低位掩码`, `~0 << ${low} = ${hex(lm)}`);
                    await set.bits('lm', lm);

                    let r = hm & lm;
                    let hls = []; for(let i=low;i<=high;i++) hls.push(i);
                    step(4, `交集`, `结果 = ${hex(r)}`);
                    await set.bits('result', r, hls);
                    set.result(`bitMask(${high}, ${low}) = ${hex(r)}`, true);
                }
            },
            {
                id: 'reverseBytes',
                name: 'reverseBytes',
                desc: '反转x的字节顺序',
                rating: 3,
                maxOps: 25,
                code: `int reverseBytes(int x) {
  return ((x >> 24) & 0xFF) | ((x >> 8) & 0xFF00) |
         ((x << 8) & 0xFF0000) | (x << 24);
}`,
                inputs: [{id:'x',label:'x',value:0x12345678}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${hex(x)}`);
                    await set.bytes('x', x);

                    let b0 = x & 0xFF;
                    let b1 = (x >> 8) & 0xFF;
                    let b2 = (x >> 16) & 0xFF;
                    let b3 = (x >> 24) & 0xFF;
                    step(2, `提取4个字节`, `[${hex(b3).slice(-2)} ${hex(b2).slice(-2)} ${hex(b1).slice(-2)} ${hex(b0).slice(-2)}]`);

                    let r = (b0 << 24) | (b1 << 16) | (b2 << 8) | b3;
                    step(3, `重新排列`, `反转后 = ${hex(r)}`);
                    await set.bytes('result', r);
                    set.result(`reverseBytes(${hex(x)}) = ${hex(r)}`, true);
                }
            },
            {
                id: 'leastBitPos',
                name: 'leastBitPos',
                desc: '返回最低有效1位的掩码',
                rating: 4,
                maxOps: 6,
                code: `int leastBitPos(int x) {
  return x & (~x + 1);
}`,
                inputs: [{id:'x',label:'x',value:96}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x} = ${hex(x)}`);
                    await set.bits('x', x);

                    let neg = ~x + 1;
                    step(2, `计算 -x`, `~x + 1 = ${hex(neg)}`);
                    await set.bits('neg', neg);

                    let r = x & neg;
                    let pos = 0, tmp = x; while(tmp && !(tmp&1)) { tmp >>= 1; pos++; }
                    step(3, `x & (-x)`, `最低位1在第${pos}位`);
                    await set.bits('result', r, [pos]);
                    set.result(`leastBitPos(${x}) = ${hex(r)} (第${pos}位)`, true);
                }
            },
            {
                id: 'logicalNeg',
                name: 'logicalNeg',
                desc: '实现 ! 操作符 (不能用!)',
                rating: 4,
                maxOps: 12,
                code: `int logicalNeg(int x) {
  return ((x | (~x + 1)) >> 31) + 1;
}`,
                inputs: [{id:'x',label:'x',value:0}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x}`);
                    await set.bits('x', x);

                    let neg = ~x + 1;
                    step(2, `计算 -x`, `~x + 1 = ${hex(neg)}`);

                    let or = x | neg;
                    step(3, `x | (-x)`, `${hex(or)}`);
                    await set.bits('or', or);

                    let sign = (or >> 31) & 1;
                    step(4, `取符号位`, `(x | -x) >> 31 = ${sign}`);

                    let r = sign + 1;
                    step(5, `结果`, `符号位 + 1 = ${r}`);
                    set.result(`logicalNeg(${x}) = ${r} ${r?'(x==0)':'(x!=0)'}`, r===1);
                }
            },
            {
                id: 'minusOne',
                name: 'minusOne',
                desc: '返回 -1',
                rating: 1,
                maxOps: 2,
                code: `int minusOne(void) {
  return ~0;
}`,
                inputs: [],
                animate: async (get, set, step) => {
                    step(1, `~0`, `0 的所有位取反`);
                    await set.bits('zero', 0);
                    await sleep(ANIM_DELAY);
                    step(2, `结果`, `~0 = -1 = ${hex(-1)}`);
                    await set.bits('result', -1);
                    set.result(`minusOne() = -1`, true);
                }
            },
            {
                id: 'tmax',
                name: 'tmax',
                desc: '返回最大补码整数 (2147483647)',
                rating: 1,
                maxOps: 4,
                code: `int tmax(void) {
  return ~(1 << 31);
}`,
                inputs: [],
                animate: async (get, set, step) => {
                    step(1, `1 << 31`, `得到 TMin = ${hex(1<<31)}`);
                    await set.bits('tmin', 1<<31, [31]);

                    let r = ~(1<<31);
                    step(2, `取反`, `~(1 << 31) = TMax = 2147483647`);
                    await set.bits('result', r);
                    set.result(`tmax() = 2147483647 = ${hex(r)}`, true);
                }
            },
            {
                id: 'negate',
                name: 'negate',
                desc: '返回 -x',
                rating: 2,
                maxOps: 5,
                code: `int negate(int x) {
  return ~x + 1;
}`,
                inputs: [{id:'x',label:'x',value:1}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x} = ${hex(x)}`);
                    await set.bits('x', x);

                    let not = ~x;
                    step(2, `~x`, `${hex(not)}`);
                    await set.bits('not', not);

                    let r = not + 1;
                    step(3, `加1`, `${hex(r)} = ${r}`);
                    await set.bits('result', r);
                    set.result(`negate(${x}) = ${r}`, true);
                }
            },
            {
                id: 'isPositive',
                name: 'isPositive',
                desc: '判断x是否为正数',
                rating: 3,
                maxOps: 8,
                code: `int isPositive(int x) {
  return (!(x >> 31)) & (!!x);
}`,
                inputs: [{id:'x',label:'x',value:5}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x}`);
                    await set.bits('x', x, [31]);

                    let sign = (x >> 31) & 1;
                    step(2, `符号位`, `(x >> 31) & 1 = ${sign}`);

                    let notNeg = sign === 0 ? 1 : 0;
                    step(3, `非负判断`, `!(x >> 31) = ${notNeg}`);

                    let notZero = x !== 0 ? 1 : 0;
                    step(4, `非零判断`, `!!x = ${notZero}`);

                    let r = notNeg & notZero;
                    step(5, `结果`, `${notNeg} & ${notZero} = ${r}`);
                    set.result(`isPositive(${x}) = ${r} ${r?'(正数)':'(非正数)'}`, r===1);
                }
            },
            {
                id: 'isLess',
                name: 'isLess',
                desc: '判断 x < y',
                rating: 3,
                maxOps: 24,
                code: `int isLess(int x, int y) {
  int sign_x = (x >> 31) & 1;
  int sign_y = (y >> 31) & 1;
  int diff = y + (~x + 1);
  int sign_diff = (diff >> 31) & 1;
  int same_sign = !(sign_x ^ sign_y);
  int not_equal = !!diff;
  return ((same_sign & !sign_diff & not_equal) | (!same_sign & sign_x)) & 1;
}`,
                inputs: [{id:'x',label:'x',value:4},{id:'y',label:'y',value:5}],
                animate: async (get, set, step) => {
                    let x = get('x'), y = get('y');
                    step(1, `输入`, `x = ${x}, y = ${y}`);
                    let r = x < y ? 1 : 0;
                    step(2, `比较`, `x < y: ${r ? '是' : '否'}`);
                    set.result(`isLess(${x}, ${y}) = ${r}`, r===1);
                }
            },
            {
                id: 'sm2tc',
                name: 'sm2tc',
                desc: '符号-数值表示转补码',
                rating: 4,
                maxOps: 15,
                code: `int sm2tc(int x) {
  int sign = x >> 31;
  int abs_val = x & 0x7FFFFFFF;
  return (abs_val ^ sign) + (sign & 1);
}`,
                inputs: [{id:'x',label:'x',value:-5}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入(符号-数值)`, `x = ${x} = ${hex(x)}`);
                    await set.bits('x', x, [31]);

                    let sign = x >> 31;
                    step(2, `符号扩展`, `sign = ${hex(sign)}`);

                    let abs = x & 0x7FFFFFFF;
                    step(3, `取绝对值`, `x & 0x7FFFFFFF = ${hex(abs)}`);
                    await set.bits('abs', abs);

                    let r = (abs ^ sign) + (sign & 1);
                    step(4, `条件取反加1`, `结果 = ${hex(r)} = ${r}`);
                    await set.bits('result', r);
                    set.result(`sm2tc(${x}) = ${r}`, true);
                }
            },
            {
                id: 'greatestBitPos',
                name: 'greatestBitPos',
                desc: '返回最高有效1位的掩码',
                rating: 4,
                maxOps: 70,
                code: `int greatestBitPos(int x) {
  int temp = x;
  temp = temp | (temp >> 1);
  temp = temp | (temp >> 2);
  temp = temp | (temp >> 4);
  temp = temp | (temp >> 8);
  temp = temp | (temp >> 16);
  return temp ^ ((temp >> 1) & ~(1 << 31));
}`,
                inputs: [{id:'x',label:'x',value:96}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x} = ${hex(x)}`);
                    await set.bits('x', x);

                    let t = x;
                    t = t | (t >> 1); t = t | (t >> 2);
                    t = t | (t >> 4); t = t | (t >> 8);
                    t = t | (t >> 16);
                    step(2, `右传播`, `所有1位向右传播 = ${hex(t)}`);
                    await set.bits('spread', t);

                    let r = t ^ ((t >>> 1) & 0x7FFFFFFF);
                    let pos = 31 - Math.floor(Math.log2(x));
                    step(3, `提取最高位`, `结果 = ${hex(r)} (第${pos}位)`);
                    await set.bits('result', r, [pos]);
                    set.result(`greatestBitPos(${x}) = ${hex(r)}`, true);
                }
            },
            {
                id: 'isNegative',
                name: 'isNegative',
                desc: '判断x是否为负数',
                rating: 2,
                maxOps: 6,
                code: `int isNegative(int x) {
  return (x >> 31) & 1;
}`,
                inputs: [{id:'x',label:'x',value:-5}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x}`);
                    await set.bits('x', x, [31]);

                    let r = (x >> 31) & 1;
                    step(2, `取符号位`, `(x >> 31) & 1 = ${r}`);
                    set.result(`isNegative(${x}) = ${r} ${r?'(负数)':'(非负)'}`, r===1);
                }
            },
            {
                id: 'isGreater',
                name: 'isGreater',
                desc: '判断 x > y',
                rating: 3,
                maxOps: 24,
                code: `int isGreater(int x, int y) {
  int sign_x = (x >> 31) & 1;
  int sign_y = (y >> 31) & 1;
  int diff = y + (~x + 1);
  int sign_diff = (diff >> 31) & 1;
  int same_sign = !(sign_x ^ sign_y);
  int not_equal = !!diff;
  return ((same_sign & sign_diff & not_equal) | (!same_sign & !sign_x)) & 1;
}`,
                inputs: [{id:'x',label:'x',value:5},{id:'y',label:'y',value:4}],
                animate: async (get, set, step) => {
                    let x = get('x'), y = get('y');
                    step(1, `输入`, `x = ${x}, y = ${y}`);
                    let r = x > y ? 1 : 0;
                    step(2, `比较`, `x > y: ${r ? '是' : '否'}`);
                    set.result(`isGreater(${x}, ${y}) = ${r}`, r===1);
                }
            },
            {
                id: 'tmin',
                name: 'tmin',
                desc: '返回最小补码整数 (-2147483648)',
                rating: 1,
                maxOps: 4,
                code: `int tmin(void) {
  return 1 << 31;
}`,
                inputs: [],
                animate: async (get, set, step) => {
                    step(1, `1 << 31`, `得到 TMin = -2147483648`);
                    await set.bits('result', 1<<31, [31]);
                    set.result(`tmin() = -2147483648 = ${hex(1<<31)}`, true);
                }
            },
            {
                id: 'plusOne',
                name: 'plusOne',
                desc: '返回 x + 1',
                rating: 1,
                maxOps: 2,
                code: `int plusOne(int x) {
  return x + 1;
}`,
                inputs: [{id:'x',label:'x',value:5}],
                animate: async (get, set, step) => {
                    let x = get('x');
                    step(1, `输入`, `x = ${x}`);
                    await set.bits('x', x);

                    let r = x + 1;
                    step(2, `加1`, `${x} + 1 = ${r}`);
                    await set.bits('result', r);
                    set.result(`plusOne(${x}) = ${r}`, true);
                }
            }
        ];

        // 生成HTML
        const container = document.getElementById('container');
        functions.forEach(f => {
            let inputsHtml = f.inputs.map(i => `<label>${i.label}: <input type="number" id="${f.id}_${i.id}" value="${i.value}"></label>`).join(' ');
            container.innerHTML += `
<div class="section" id="${f.id}">
  <h2>${f.name} - ${f.desc} <span class="rating">[${f.rating}分]</span></h2>
  <div class="code">${f.code}</div>
  <div class="ops">最大操作数: ${f.maxOps}</div>
  <div class="controls">
    ${inputsHtml}
    <button onclick="runAnimation('${f.id}')">▶ 动画演示</button>
    <button onclick="resetAnimation('${f.id}')">重置</button>
  </div>
  <div id="${f.id}_steps"></div>
  <div id="${f.id}_bits"></div>
  <div class="result-box" id="${f.id}_result">点击动画演示查看结果</div>
</div>`;
        });

        // 运行动画
        window.runAnimation = async function(id) {
            const f = functions.find(x => x.id === id);
            const get = name => parseInt(document.getElementById(`${id}_${name}`).value) | 0;
            const stepsDiv = document.getElementById(`${id}_steps`);
            const bitsDiv = document.getElementById(`${id}_bits`);
            const resultDiv = document.getElementById(`${id}_result`);

            stepsDiv.innerHTML = '';
            bitsDiv.innerHTML = '';
            resultDiv.innerHTML = '计算中...';
            resultDiv.className = 'result-box';

            let bitCounter = 0;
            const step = (num, title, desc) => {
                stepsDiv.innerHTML += `<div class="step"><span class="step-num">${num}</span><b>${title}</b><br><span class="value">${desc}</span></div>`;
            };
            const set = {
                bits: async (label, value, highlight = []) => {
                    bitsDiv.innerHTML += `<div class="bits-container"><div class="bits-label">${label}:</div>${renderBitsWithLabels(value, highlight)}</div>`;
                    await sleep(ANIM_DELAY);
                },
                bytes: async (label, value) => {
                    let b = [(value>>>24)&0xFF, (value>>>16)&0xFF, (value>>>8)&0xFF, value&0xFF];
                    bitsDiv.innerHTML += `<div class="bits-container"><div class="bits-label">${label}:</div><div style="text-align:center;font-size:14px;">[${b.map(x=>hex(x).slice(-2)).join(' ')}]</div></div>`;
                    await sleep(ANIM_DELAY);
                },
                result: (text, success) => {
                    resultDiv.innerHTML = text;
                    resultDiv.className = success ? 'result-box' : 'result-box error';
                }
            };

            await f.animate(get, set, step);
        };

        window.resetAnimation = function(id) {
            document.getElementById(id + '_steps').innerHTML = '';
            document.getElementById(id + '_bits').innerHTML = '';
            document.getElementById(id + '_result').innerHTML = '点击动画演示查看结果';
            document.getElementById(id + '_result').className = 'result-box';
        };
    </script>
</body>
</html>
